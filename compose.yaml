services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cleanflow
      POSTGRES_USER: cleanflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - cleanflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanflow -d cleanflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OWNER_NOTIFICATION_EMAIL: ${OWNER_NOTIFICATION_EMAIL:-}
      EMAIL_LOG_PATH: ${EMAIL_LOG_PATH:-}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-http://127.0.0.1:3000}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_EMAIL_OVERRIDE: ${DEMO_EMAIL_OVERRIDE:-}
      DEMO_REUSE_AI_RESULTS: ${DEMO_REUSE_AI_RESULTS:-true}
      RATE_LIMIT_INQUIRY: ${RATE_LIMIT_INQUIRY:-20}
      RATE_LIMIT_SIMULATE: ${RATE_LIMIT_SIMULATE:-5}
      RATE_LIMIT_CLASSIFY: ${RATE_LIMIT_CLASSIFY:-10}
      RATE_LIMIT_DRAFT: ${RATE_LIMIT_DRAFT:-10}
      RATE_LIMIT_EMAIL: ${RATE_LIMIT_EMAIL:-5}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_RESET: ${RATE_LIMIT_RESET:-3}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  cleanflow_db:
